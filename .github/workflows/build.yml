name: Build Null Client
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.0
      - name: Build
        run: |
          set -o pipefail
          gradle build --stacktrace 2>&1 | tee build.log
      - name: Show errors
        if: failure()
        run: |
          echo '~~~' >> $GITHUB_STEP_SUMMARY
          grep -E -A3 "error:|What went wrong" build.log | head -60 >> $GITHUB_STEP_SUMMARY
          echo '~~~' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: null-client-jar
          path: build/libs/null-client-*[0-9].jar
